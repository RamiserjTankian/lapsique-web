<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lapsique Media liquid glass glitch</title>
  <script src="./vendor/anime.min.js"></script>
  <style>
    @font-face {
      font-family: 'Syne';
      src: url('../fonts/Syne-ExtraBold.ttf') format('truetype');
      font-weight: 800;
      font-style: normal;
      font-display: block;
    }

    @font-face {
      font-family: 'IBM Plex Mono';
      src: url('../fonts/IBMPlexMono-SemiBold.ttf') format('truetype');
      font-weight: 600;
      font-style: normal;
      font-display: block;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 42%, rgba(242, 193, 95, .24), transparent 24%),
        radial-gradient(circle at 24% 68%, rgba(119, 213, 223, .12), transparent 28%),
        radial-gradient(circle at 72% 35%, rgba(247, 245, 240, .08), transparent 22%),
        linear-gradient(145deg, #020204 0%, #08080d 46%, #161006 100%);
    }

    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: grid;
      place-items: center;
      isolation: isolate;
    }

    .liquid-field,
    .glass-shell,
    .logo-wrap,
    .noise,
    .scanline {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .liquid-field {
      background:
        radial-gradient(ellipse at 47% 53%, rgba(255, 255, 255, .16), transparent 13%),
        radial-gradient(ellipse at 52% 50%, rgba(242, 193, 95, .28), transparent 22%),
        repeating-radial-gradient(ellipse at 50% 52%, rgba(242, 193, 95, .22) 0 1px, transparent 2px 20px);
      mix-blend-mode: screen;
      opacity: .72;
      filter: blur(.5px);
    }

    .glass-shell {
      inset: 50% auto auto 50%;
      width: min(76vw, 1640px);
      height: min(25vw, 540px);
      border-radius: 999px;
      transform: translate(-50%, -43%);
      background:
        linear-gradient(104deg, rgba(255, 255, 255, .08), rgba(255, 255, 255, .018)),
        radial-gradient(circle at 24% 24%, rgba(255, 255, 255, .28), transparent 17%),
        radial-gradient(circle at 72% 64%, rgba(242, 193, 95, .28), transparent 28%);
      border: 1px solid rgba(255, 255, 255, .22);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .42),
        inset 0 -42px 88px rgba(255, 255, 255, .04),
        0 52px 150px rgba(242, 193, 95, .2);
      filter: blur(.18px) saturate(1.28);
      opacity: .82;
    }

    .noise {
      background-image:
        linear-gradient(90deg, rgba(255, 0, 90, .08), transparent 20%, rgba(0, 210, 255, .08) 82%, transparent),
        repeating-linear-gradient(0deg, rgba(255, 255, 255, .045) 0 1px, transparent 1px 7px);
      mix-blend-mode: screen;
      opacity: 0;
    }

    .scanline {
      background: linear-gradient(180deg, transparent 0%, rgba(255, 255, 255, .42) 50%, transparent 100%);
      height: 180px;
      top: 42%;
      opacity: 0;
      mix-blend-mode: screen;
      transform: translateY(-220px);
    }

    .logo-wrap {
      inset: auto;
      width: min(72vw, 1560px);
      aspect-ratio: 450 / 104;
      margin-left: min(8vw, 150px);
      transform: translateY(0);
      z-index: 2;
    }

    .logo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: auto;
      overflow: visible;
    }

    .logo * {
      transform-box: fill-box;
      transform-origin: center;
    }

    .logo-main {
      filter: drop-shadow(0 18px 46px rgba(0, 0, 0, .42));
    }

    .logo-cyan,
    .logo-red {
      opacity: 0;
      mix-blend-mode: screen;
    }

    .logo-cyan {
      color: #47e9ff;
      filter: drop-shadow(0 0 16px rgba(71, 233, 255, .8));
    }

    .logo-red {
      color: #ff2f7d;
      filter: drop-shadow(0 0 16px rgba(255, 47, 125, .78));
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="Lapsique Media liquid glass logo animation">
    <div class="liquid-field"></div>
    <div class="glass-shell"></div>
    <div class="logo-wrap">
      <svg class="logo logo-red" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 104" aria-hidden="true">
        <g>
          <rect x="16" y="16" width="72" height="72" rx="16" fill="rgba(255,255,255,.08)" stroke="currentColor" stroke-opacity=".58" stroke-width="2"/>
          <text x="52" y="53" text-anchor="middle" dominant-baseline="middle" font-family="Syne, Inter, Arial, sans-serif" font-size="36" font-weight="800" fill="currentColor">l</text>
          <text x="104" y="50" font-family="Syne, Inter, Arial, sans-serif" font-size="36" font-weight="800" fill="currentColor">lapsique</text>
          <text x="104" y="79" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" font-size="21.8" font-weight="600" letter-spacing="7.8" fill="currentColor">media</text>
        </g>
      </svg>
      <svg class="logo logo-cyan" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 104" aria-hidden="true">
        <g>
          <rect x="16" y="16" width="72" height="72" rx="16" fill="rgba(255,255,255,.08)" stroke="currentColor" stroke-opacity=".58" stroke-width="2"/>
          <text x="52" y="53" text-anchor="middle" dominant-baseline="middle" font-family="Syne, Inter, Arial, sans-serif" font-size="36" font-weight="800" fill="currentColor">l</text>
          <text x="104" y="50" font-family="Syne, Inter, Arial, sans-serif" font-size="36" font-weight="800" fill="currentColor">lapsique</text>
          <text x="104" y="79" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" font-size="21.8" font-weight="600" letter-spacing="7.8" fill="currentColor">media</text>
        </g>
      </svg>
      <svg class="logo logo-main" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 104" role="img" aria-labelledby="title desc">
        <title id="title">Lapsique Media liquid glass logo</title>
        <desc id="desc">Compact logo over liquid glass with subtle glitch and chromatic aberration.</desc>
        <defs>
          <linearGradient id="iconFillLiquid" x1="0" x2="1" y1="0" y2="1">
            <stop offset="0" stop-color="#fffdf2" stop-opacity=".98"/>
            <stop offset=".55" stop-color="#f7f5f0" stop-opacity=".92"/>
            <stop offset="1" stop-color="#d8c7a2" stop-opacity=".35"/>
          </linearGradient>
          <filter id="iconGlowLiquid" x="-55%" y="-70%" width="210%" height="240%" color-interpolation-filters="sRGB">
            <feGaussianBlur stdDeviation="3.4" result="blur"/>
            <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.95 0 1 0 0 0.68 0 0 1 0 0.16 0 0 0 .56 0"/>
            <feMerge>
              <feMergeNode/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>
        <g>
          <rect class="icon-aurora" x="12" y="12" width="80" height="80" rx="19" fill="#f2c15f" fill-opacity=".18" filter="url(#iconGlowLiquid)"/>
          <rect x="16" y="16" width="72" height="72" rx="16" fill="url(#iconFillLiquid)" stroke="#d8c7a2" stroke-opacity=".76" stroke-width="2"/>
          <text x="52" y="53" text-anchor="middle" dominant-baseline="middle" font-family="Syne, Inter, Arial, sans-serif" font-size="36" font-weight="800" fill="#f2c15f">l</text>
          <text x="104" y="50" font-family="Syne, Inter, Arial, sans-serif" font-size="36" font-weight="800" fill="#ffffff">lapsique</text>
          <text x="104" y="79" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" font-size="21.8" font-weight="600" letter-spacing="7.8" fill="#f2c15f">media</text>
        </g>
      </svg>
    </div>
    <div class="noise"></div>
    <div class="scanline"></div>
  </main>

  <script>
    const manual = new URLSearchParams(window.location.search).get('manual') === '1';
    const duration = 6200;

    anime.set('.logo-wrap', { translateY: 0, scale: 1 });
    anime.set('.glass-shell', { scaleX: 1, scaleY: 1, rotate: 0 });
    anime.set('.liquid-field', { scaleX: 1, scaleY: 1, rotate: 0, opacity: .72 });
    anime.set('.logo-red, .logo-cyan, .noise, .scanline', { opacity: 0 });

    const timeline = anime.timeline({
      autoplay: false,
      duration,
      easing: 'easeInOutSine',
    });

    timeline
      .add({
        targets: '.logo-wrap',
        translateY: [0, -18, 10, 0],
        scale: [1, 1.018, .996, 1],
        duration,
      }, 0)
      .add({
        targets: '.glass-shell',
        scaleX: [1, 1.055, .985, 1.03, 1],
        scaleY: [1, .94, 1.045, .965, 1],
        rotate: [0, -1.1, .8, -.35, 0],
        duration,
      }, 0)
      .add({
        targets: '.liquid-field',
        scaleX: [1, 1.08, .98, 1.05, 1],
        scaleY: [1, .92, 1.08, .96, 1],
        rotate: [0, .9, -.7, .45, 0],
        opacity: [.72, .88, .66, .82, .72],
        duration,
      }, 0)
      .add({
        targets: '.logo-main',
        filter: [
          'drop-shadow(0 18px 46px rgba(0,0,0,.42)) blur(0px)',
          'drop-shadow(0 22px 58px rgba(242,193,95,.18)) blur(.16px)',
          'drop-shadow(0 16px 42px rgba(0,0,0,.4)) blur(0px)',
        ],
        duration,
      }, 0)
      .add({
        targets: '.logo-red',
        opacity: [0, .82, 0, .5, 0],
        translateX: [0, -18, 8, -6, 0],
        translateY: [0, 5, -3, 2, 0],
        duration: 620,
        easing: 'steps(4)',
      }, 3650)
      .add({
        targets: '.logo-cyan',
        opacity: [0, .78, 0, .45, 0],
        translateX: [0, 16, -10, 7, 0],
        translateY: [0, -4, 3, -2, 0],
        duration: 620,
        easing: 'steps(4)',
      }, 3650)
      .add({
        targets: '.logo-main',
        translateX: [0, 8, -5, 3, 0],
        skewX: [0, -3, 2, -1, 0],
        filter: [
          'drop-shadow(0 18px 46px rgba(0,0,0,.42)) blur(0px)',
          'drop-shadow(0 0 24px rgba(242,193,95,.48)) blur(.55px)',
          'drop-shadow(0 18px 46px rgba(0,0,0,.42)) blur(0px)',
        ],
        duration: 620,
        easing: 'steps(5)',
      }, 3650)
      .add({
        targets: '.noise',
        opacity: [0, .56, 0, .34, 0],
        duration: 620,
        easing: 'steps(4)',
      }, 3650)
      .add({
        targets: '.scanline',
        opacity: [0, .45, 0],
        translateY: [-260, 260],
        duration: 520,
        easing: 'easeInOutQuad',
      }, 3700);

    window.logoReady = true;
    window.logoDuration = duration;
    window.logoAnimation = timeline;
    window.renderAt = (timeMs) => {
      timeline.seek(Math.max(0, Math.min(duration, timeMs)));
    };

    if (!manual) {
      timeline.play();
    }
  </script>
</body>
</html>
